name: CI - 05-cicd-app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      cicd: ${{ steps.filter.outputs.cicd }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cicd:
              - '05-cicd-app/**'
  test:
    needs: changes
    if: needs.changes.outputs.cicd == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Rodar testes
        run: go test ./...
        working-directory: 05-cicd-app

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
            context: 05-cicd-app
            push: true
            tags: ghcr.io/igorpompeo/devops-portfolio/05-cicd-app:latest